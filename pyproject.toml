[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seekvln"
version = "0.1.0"
description = "SeekVLN inference and VLN-CE evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "transformers==4.46.3",
  "accelerate==1.10.1", "peft==0.17.1", "numpy==1.26.0",
  "safetensors>=0.4.5,<1", "huggingface-hub>=0.26,<1",
  "sentencepiece==0.1.99", "einops==0.6.1", "decord==0.6.0",
  "opencv-python==4.8.0.74", "Pillow>=9,<12", "PyYAML>=6,<7",
  "requests>=2,<3", "loguru>=0.7,<1", "packaging>=23",
  "s2wrapper @ git+https://github.com/bfshi/scaling_on_scales@9c008a37540e761f53574b488979db6e49a64312",
]

[project.optional-dependencies]
habitat = [
  "gym==0.17.3", "numpy-quaternion==2024.0.13", "attrs>=19.1",
  "dtw==1.4.0", "fastdtw==0.3.4", "networkx>=2.5,<4",
  "yacs==0.1.8", "tensorboard>=2.15,<3", "imageio>=2.20,<3",
  "imageio-ffmpeg>=0.4,<1", "tqdm>=4.60,<5", "lmdb>=1,<2",
  "msgpack-numpy>=0.4,<1", "jsonlines>=3,<5", "fvcore>=0.1.5",
  "webdataset==0.1.103", "matplotlib>=3.5,<4", "scipy>=1.10,<1.16",
  "av>=13,<17", "ifcfg>=0.21,<1",
]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
include = ["llava*", "evaluation*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
"llava.model.language_model" = ["chat_templates/*.jinja"]
"evaluation.habitat_extensions.config" = ["*.yaml"]
"evaluation.vlnce_baselines.config" = ["r2r_baselines/*.yaml", "rxr_baselines/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "evaluation", "scripts/eval", "runtime_compat"]
